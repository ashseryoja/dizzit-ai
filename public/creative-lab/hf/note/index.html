<!doctype html>
<html lang="ru" data-format="9:16" data-h="1920" data-composition-variables='[
  {"id":"quote","type":"string","label":"Цитата","default":"Мы боялись, что дом получится холодным. Он получился про нас."},
  {"id":"client","type":"string","label":"Клиент","default":"Анна и Павел"},
  {"id":"title","type":"string","label":"Проект","default":"Дом в Сосновке · 2026"},
  {"id":"lead","type":"string","label":"Надпись","default":"Отзыв"},
  {"id":"theme","type":"enum","label":"Тема","default":"dark","options":["light","dark"]},
  {"id":"accent","type":"color","label":"Акцент","default":"#ff5a1f"},
  {"id":"photo1","type":"image","label":"Фотография","default":""},{"id":"focus1","type":"string","label":"Фокус 1","default":"50% 50%"},
  {"id":"photo2","type":"image","label":"Деталь (по желанию)","default":""},{"id":"focus2","type":"string","label":"Фокус 2","default":"50% 50%"}
]'>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Studio note</title>
  <link rel="stylesheet" href="../_shared/lab.css" />
  <script src="../_shared/gsap.min.js"></script>
  <script src="../_shared/lab.js"></script>
  <style>
    .tags { position: absolute; top: var(--safe-top); left: var(--safe-left); right: var(--safe-right); display: flex; justify-content: space-between; align-items: baseline; }
    .card { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; visibility: hidden; padding: 64px var(--safe-right) var(--safe-bottom) var(--safe-left); display: flex; flex-direction: column; justify-content: flex-end; gap: 30px; }
    html[data-format="4:5"] .card { height: 64%; }
    .card .bar { position: relative; display: block; width: 140px; }
    .card .sign { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 10px; }
    .card .sign .who { display: flex; flex-direction: column; gap: 12px; }
    .card .tile { position: absolute; right: var(--safe-right); top: -120px; width: 240px; height: 300px; visibility: hidden; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="note" data-start="0" data-width="1080" data-height="1920">
    <span class="font-warm t-quote">Ag Жф</span><span class="font-warm t-body">Ag Жф</span><span class="font-warm t-mono">01 Жф</span>
  </div>
  <script>
    (function () {
      var L = window.Lab, B = L.B, root = document.getElementById("root");
      L.theme();
      var all = L.photos(2);
      if (!all.length) { var tl0 = gsap.timeline({ paused: true }); tl0.set({}, {}, 1); L.register("note", tl0); return; }
      var tl = gsap.timeline({ paused: true });
      var photo = L.photo(root, all[0]);
      L.el("div", "scrim top", root);
      var tags = L.el("div", "tags on-photo t-mono", root);
      L.el("span", "accent", tags, L.text("lead", "Отзыв")); L.el("span", "", tags, L.text("title", "").split("·").pop().trim());
      var card = L.el("div", "card block", root);
      var tile = all[1] ? L.photo(card, all[1], "tile") : null;
      var bar = L.el("span", "bar", card);
      var q = L.text("quote", "");
      var lines = L.lines(card, "«" + q + "»", 24, "t-quote");
      var sign = L.el("div", "sign", card);
      var who = L.el("div", "who", sign);
      var client = L.el("span", "t-body", who, L.text("client", ""));
      var proj = L.el("span", "t-mono muted", who, L.text("title", ""));
      var total = B * 2.4 + B * 1 + 5;
      L.cut(tl, photo, 0, { scale: 1.1, dur: B * 1.2 });
      L.push(tl, photo, B * 1.2, total - B * 1.2, .006);
      tl.set(tags.children, { autoAlpha: 0 }, 0); tl.set(tags.children, { autoAlpha: 1, stagger: B / 4 }, B * .5);
      var c = B * 2.4;
      L.slide(tl, card, c, { xPercent: 0, yPercent: 100, dur: B * .8 });
      if (tile) L.wipe(tl, tile, c + B * .9, { from: "bottom", dur: B * .6 });
      L.bar(tl, bar, c + B * .5);
      L.slam(tl, lines, c + B * .6, { stagger: B / 6 });
      tl.set([client, proj], { autoAlpha: 0 }, 0);
      tl.set([client, proj], { autoAlpha: 1, stagger: B / 4 }, c + B * 1.5);
      L.finish(tl, root, total);
      L.register("note", tl);
    })();
  </script>
</body>
</html>
