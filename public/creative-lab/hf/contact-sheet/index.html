<!doctype html>
<html lang="ru" data-format="9:16" data-h="1920" data-composition-variables='[
  {"id":"title","type":"string","label":"Проект","default":"Квартира на Петроградской"},
  {"id":"meta","type":"string","label":"Подпись","default":"Съёмка · 2026"},
  {"id":"theme","type":"enum","label":"Тема","default":"dark","options":["light","dark"]},
  {"id":"accent","type":"color","label":"Акцент","default":"#ff5a1f"},
  {"id":"photo1","type":"image","label":"Кадр 1","default":""},{"id":"focus1","type":"string","label":"Фокус 1","default":"50% 50%"},{"id":"cap1","type":"string","label":"Подпись 1","default":""},
  {"id":"photo2","type":"image","label":"Кадр 2","default":""},{"id":"focus2","type":"string","label":"Фокус 2","default":"50% 50%"},{"id":"cap2","type":"string","label":"Подпись 2","default":""},
  {"id":"photo3","type":"image","label":"Кадр 3","default":""},{"id":"focus3","type":"string","label":"Фокус 3","default":"50% 50%"},{"id":"cap3","type":"string","label":"Подпись 3","default":""},
  {"id":"photo4","type":"image","label":"Кадр 4","default":""},{"id":"focus4","type":"string","label":"Фокус 4","default":"50% 50%"},{"id":"cap4","type":"string","label":"Подпись 4","default":""},
  {"id":"photo5","type":"image","label":"Кадр 5","default":""},{"id":"focus5","type":"string","label":"Фокус 5","default":"50% 50%"},{"id":"cap5","type":"string","label":"Подпись 5","default":""},
  {"id":"photo6","type":"image","label":"Кадр 6","default":""},{"id":"focus6","type":"string","label":"Фокус 6","default":"50% 50%"},{"id":"cap6","type":"string","label":"Подпись 6","default":""},
  {"id":"photo7","type":"image","label":"Кадр 7","default":""},{"id":"focus7","type":"string","label":"Фокус 7","default":"50% 50%"},{"id":"cap7","type":"string","label":"Подпись 7","default":""},
  {"id":"photo8","type":"image","label":"Кадр 8","default":""},{"id":"focus8","type":"string","label":"Фокус 8","default":"50% 50%"},{"id":"cap8","type":"string","label":"Подпись 8","default":""}
]'>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Contact sheet</title>
  <link rel="stylesheet" href="../_shared/lab.css" />
  <script src="../_shared/gsap.min.js"></script>
  <script src="../_shared/lab.js"></script>
  <style>
    .sheet { position: absolute; inset: 0; }
    .sheet .photo { visibility: hidden; background: var(--fg-24); }
    .sheet .photo .idx { position: absolute; left: 14px; top: 14px; color: #fff; mix-blend-mode: difference; }
    .head { position: absolute; top: var(--safe-top); left: var(--safe-left); right: var(--safe-right); display: flex; justify-content: space-between; align-items: baseline; }
    .foot { position: absolute; left: var(--safe-left); right: var(--safe-right); bottom: var(--safe-bottom); display: flex; justify-content: space-between; align-items: flex-end; }
    .foot .bar { position: absolute; left: 0; top: -34px; width: 140px; }
    .shot { position: absolute; inset: 0; visibility: hidden; }
    .shot .tags { position: absolute; top: var(--safe-top); left: var(--safe-left); right: var(--safe-right); display: flex; justify-content: space-between; align-items: baseline; }
    .shot .cap { position: absolute; left: var(--safe-left); right: var(--safe-right); bottom: var(--safe-bottom); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="contact-sheet" data-start="0" data-width="1080" data-height="1920">
    <span class="font-warm t-head">Ag Жф</span><span class="font-warm t-mono">01 Жф</span><span class="font-warm t-num">01</span>
  </div>
  <script>
    (function () {
      var L = window.Lab, B = L.B, root = document.getElementById("root");
      L.theme();
      var all = L.photos(8);
      if (!all.length) { var tl0 = gsap.timeline({ paused: true }); tl0.set({}, {}, 1); L.register("contact-sheet", tl0); return; }
      var S = L.safe(), tl = gsap.timeline({ paused: true });
      var title = L.text("title", ""), meta = L.text("meta", "");
      var sheet = L.el("div", "sheet", root);
      var head = L.el("div", "head t-mono", sheet);
      L.el("span", "", head, title);
      L.el("span", "muted", head, meta);
      var cells = L.grid(all.length, all.length > 4 ? 3 : 2, 1.25, 14, { top: S.top + 90, bottom: S.bottom + 110, left: S.left, right: S.right });
      var tiles = all.map(function (p, i) {
        var c = cells[i], tile = L.photo(sheet, p);
        tile.style.left = c.x + "px"; tile.style.top = c.y + "px"; tile.style.width = c.w + "px"; tile.style.height = c.h + "px";
        L.el("span", "idx t-mono", tile, L.pad(i + 1));
        return tile;
      });
      var foot = L.el("div", "foot t-mono", sheet);
      L.el("span", "bar", foot);
      L.el("span", "", foot, L.pad(all.length) + " кадров");
      L.el("span", "muted", foot, meta);
      /* Лист собирается щелчками. */
      tl.set(head.children, { autoAlpha: 0 }, 0);
      tl.set(head.children, { autoAlpha: 1, stagger: B / 4 }, B * .5);
      tl.set(tiles, { autoAlpha: 1, stagger: B / 8 }, B * .5);
      L.bar(tl, foot.firstChild, B * 1.5);
      tl.set(foot.querySelectorAll("span:not(.bar)"), { autoAlpha: 0 }, 0);
      tl.set(foot.querySelectorAll("span:not(.bar)"), { autoAlpha: 1, stagger: B / 4 }, B * 1.8);
      var t = B * 3.5, HOLD = B * 2.2, BACK = B;
      /* Каждый кадр: резкий выход во весь экран, потом вспышка листа. */
      all.forEach(function (p, i) {
        var g = L.el("div", "shot", root);
        var photo = L.photo(g, p);
        L.el("div", "scrim", g); L.el("div", "scrim top", g);
        var tags = L.el("div", "tags on-photo t-mono", g);
        L.el("span", "", tags, title);
        L.el("span", "", tags, L.pad(i + 1) + " / " + L.pad(all.length));
        var num = L.el("div", "num t-num", g, L.pad(i + 1));
        var cap = L.el("div", "cap on-photo", g);
        var lines = p.caption ? L.lines(cap, p.caption, 16, "t-head") : [];
        L.cut(tl, g, t, { scale: 1.1 });
        tl.fromTo(num, { xPercent: 30 }, { xPercent: 0, duration: B * .8, ease: L.E.enter }, t);
        if (lines.length) L.slam(tl, lines, t + B * .2);
        L.push(tl, photo, t + B * .9, HOLD - B * .9, .012);
        tl.set(g, { autoAlpha: 0 }, t + HOLD);
        tl.set(tiles[i], { autoAlpha: 0 }, t);
        tl.set(tiles[i], { autoAlpha: 1 }, t + HOLD);
        t += HOLD + BACK;
      });
      /* Финал: лист целиком. */
      t += 1.6;
      L.finish(tl, root, t);
      L.register("contact-sheet", tl);
    })();
  </script>
</body>
</html>
