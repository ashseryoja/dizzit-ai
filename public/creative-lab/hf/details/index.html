<!doctype html>
<html lang="ru" data-format="9:16" data-h="1920" data-composition-variables='[
  {"id":"title","type":"string","label":"Проект","default":"Квартира у парка"},
  {"id":"lead","type":"string","label":"Заголовок","default":"Три детали"},
  {"id":"theme","type":"enum","label":"Тема","default":"dark","options":["light","dark"]},
  {"id":"accent","type":"color","label":"Акцент","default":"#ff5a1f"},
  {"id":"photo1","type":"image","label":"Деталь 1","default":""},{"id":"focus1","type":"string","label":"Фокус 1","default":"50% 50%"},{"id":"cap1","type":"string","label":"Подпись 1","default":""},
  {"id":"photo2","type":"image","label":"Деталь 2","default":""},{"id":"focus2","type":"string","label":"Фокус 2","default":"50% 50%"},{"id":"cap2","type":"string","label":"Подпись 2","default":""},
  {"id":"photo3","type":"image","label":"Деталь 3","default":""},{"id":"focus3","type":"string","label":"Фокус 3","default":"50% 50%"},{"id":"cap3","type":"string","label":"Подпись 3","default":""},
  {"id":"photo4","type":"image","label":"Деталь 4","default":""},{"id":"focus4","type":"string","label":"Фокус 4","default":"50% 50%"},{"id":"cap4","type":"string","label":"Подпись 4","default":""},
  {"id":"photo5","type":"image","label":"Общий кадр","default":""},{"id":"focus5","type":"string","label":"Фокус 5","default":"50% 50%"}
]'>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Details</title>
  <link rel="stylesheet" href="../_shared/lab.css" />
  <script src="../_shared/gsap.min.js"></script>
  <script src="../_shared/lab.js"></script>
  <style>
    .shot { position: absolute; inset: 0; visibility: hidden; }
    .tags { position: absolute; top: var(--safe-top); left: var(--safe-left); right: var(--safe-right); display: flex; justify-content: space-between; align-items: baseline; }
    .cap { position: absolute; left: var(--safe-left); right: var(--safe-right); bottom: var(--safe-bottom); }
    .cap .bar { position: relative; display: block; width: 140px; margin-bottom: 30px; }
    .end { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; visibility: hidden; padding: 60px var(--safe-right) var(--safe-bottom) var(--safe-left); display: flex; flex-direction: column; justify-content: flex-end; }
    .end .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 36px; }
    .end .row { display: flex; gap: 28px; align-items: baseline; padding: 22px 0; border-top: 2px solid currentColor; visibility: hidden; }
    .end .row:last-child { border-bottom: 2px solid currentColor; }
    .end .row .t-mono { flex: none; width: 90px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="details" data-start="0" data-width="1080" data-height="1920">
    <span class="font-warm t-head">Ag Жф</span><span class="font-warm t-body">Ag Жф</span><span class="font-warm t-mono">01 Жф</span><span class="font-warm t-num">01</span>
  </div>
  <script>
    (function () {
      var L = window.Lab, B = L.B, root = document.getElementById("root");
      L.theme();
      var all = L.photos(5);
      if (!all.length) { var tl0 = gsap.timeline({ paused: true }); tl0.set({}, {}, 1); L.register("details", tl0); return; }
      var wide = all.length > 1 ? all[all.length - 1] : null;
      var details = wide ? all.slice(0, -1) : all;
      var lead = L.text("lead", "Три детали"), title = L.text("title", "");
      var tl = gsap.timeline({ paused: true });
      var t = 0, HOLD = B * 2.8;
      details.forEach(function (d, i) {
        var g = L.el("div", "shot", root);
        var p = L.photo(g, d);
        L.el("div", "scrim", g); L.el("div", "scrim top", g);
        var tags = L.el("div", "tags on-photo t-mono", g);
        L.el("span", "", tags, i === 0 ? lead : title);
        L.el("span", "muted", tags, L.pad(i + 1) + " / " + L.pad(details.length));
        var num = L.el("div", "num t-num", g, L.pad(i + 1));
        var cap = L.el("div", "cap on-photo", g);
        var bar = L.el("span", "bar thin", cap);
        var lines = L.lines(cap, d.caption || "", 16, "t-head");
        L.cut(tl, g, t, { scale: 1.08 });
        tl.fromTo(num, { xPercent: 30 }, { xPercent: 0, duration: B * .8, ease: L.E.enter }, t);
        L.bar(tl, bar, t + B * .2);
        if (lines.length) L.slam(tl, lines, t + B * .25);
        L.push(tl, p, t + B * .9, HOLD - B * .9, .012);
        t += HOLD;
        if (lines.length) L.slamOut(tl, lines, t - B * .4);
        tl.set(g, { autoAlpha: 0 }, t + B * .2);
      });
      /* Финал: общий кадр и инверсный указатель всех деталей. */
      var g = L.el("div", "shot", root);
      var p = L.photo(g, wide || details[details.length - 1]);
      var end = L.el("div", "end block", g);
      var head = L.el("div", "head", end);
      L.el("span", "t-head", head, title || lead);
      L.el("span", "t-mono muted", head, L.pad(details.length));
      var rows = details.map(function (d, i) {
        var r = L.el("div", "row", end);
        L.el("span", "t-mono", r, L.pad(i + 1));
        L.el("span", "t-body", r, d.caption || "");
        return r;
      });
      L.cut(tl, g, t, { scale: 1.08 });
      L.push(tl, p, t, B * 2 + 2.6, .008);
      L.slide(tl, end, t + B * 1.2, { xPercent: 0, yPercent: 100, dur: B * .8 });
      tl.set(rows, { autoAlpha: 1, stagger: B / 4 }, t + B * 1.8);
      t += B * 2 + 2.6;
      L.finish(tl, root, t);
      L.register("details", tl);
    })();
  </script>
</body>
</html>
