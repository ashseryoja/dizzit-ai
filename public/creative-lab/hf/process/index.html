<!doctype html>
<html lang="ru" data-format="9:16" data-h="1920" data-composition-variables='[
  {"id":"title","type":"string","label":"Проект","default":"Кухня-гостиная"},
  {"id":"meta","type":"string","label":"Подпись","default":"От эскиза до реализации"},
  {"id":"stage1","type":"string","label":"Этап 1","default":"Эскиз"},
  {"id":"stage2","type":"string","label":"Этап 2","default":"3D"},
  {"id":"stage3","type":"string","label":"Этап 3","default":"Реализация"},
  {"id":"theme","type":"enum","label":"Тема","default":"dark","options":["light","dark"]},
  {"id":"accent","type":"color","label":"Акцент","default":"#ff5a1f"},
  {"id":"photo1","type":"image","label":"Эскиз","default":""},{"id":"focus1","type":"string","label":"Фокус 1","default":"50% 50%"},
  {"id":"photo2","type":"image","label":"3D-визуализация","default":""},{"id":"focus2","type":"string","label":"Фокус 2","default":"50% 50%"},
  {"id":"photo3","type":"image","label":"Фото реализации","default":""},{"id":"focus3","type":"string","label":"Фокус 3","default":"50% 50%"},
  {"id":"photo4","type":"image","label":"Общий кадр (по желанию)","default":""},{"id":"focus4","type":"string","label":"Фокус 4","default":"50% 50%"}
]'>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Process</title>
  <link rel="stylesheet" href="../_shared/lab.css" />
  <script src="../_shared/gsap.min.js"></script>
  <script src="../_shared/lab.js"></script>
  <style>
    .split { position: absolute; inset: 0; }
    .col { position: absolute; top: calc(var(--safe-top) + 80px); bottom: calc(var(--safe-bottom) + 120px); overflow: hidden; visibility: hidden; }
    .col .photo { width: 300%; }
    .col .lbl { position: absolute; left: 0; right: 0; top: 100%; margin-top: 22px; }
    .head { position: absolute; top: var(--safe-top); left: var(--safe-left); right: var(--safe-right); display: flex; justify-content: space-between; align-items: baseline; }
    .foot { position: absolute; left: var(--safe-left); right: var(--safe-right); bottom: var(--safe-bottom); display: flex; justify-content: space-between; align-items: baseline; }
    .foot .bar { position: absolute; left: 0; top: -34px; width: 140px; }
    .shot { position: absolute; inset: 0; visibility: hidden; }
    .shot .tags { position: absolute; top: var(--safe-top); left: var(--safe-left); right: var(--safe-right); display: flex; justify-content: space-between; align-items: baseline; }
    .shot .cap { position: absolute; left: var(--safe-left); right: var(--safe-right); bottom: var(--safe-bottom); }
    .end { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; visibility: hidden; padding: 56px var(--safe-right) var(--safe-bottom) var(--safe-left); display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; }
    .end .bar { position: relative; display: block; width: 140px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="process" data-start="0" data-width="1080" data-height="1920">
    <span class="font-warm t-display">Ag Жф</span><span class="font-warm t-head">Ag Жф</span><span class="font-warm t-mono">01 Жф</span>
  </div>
  <script>
    (function () {
      var L = window.Lab, B = L.B, root = document.getElementById("root");
      L.theme();
      var all = L.photos(4);
      if (!all.length) { var tl0 = gsap.timeline({ paused: true }); tl0.set({}, {}, 1); L.register("process", tl0); return; }
      var stages = all.slice(0, 3), wide = all[3] || null;
      var names = [L.text("stage1", "Эскиз"), L.text("stage2", "3D"), L.text("stage3", "Реализация")].slice(0, stages.length);
      var S = L.safe(), tl = gsap.timeline({ paused: true });
      var title = L.text("title", ""), meta = L.text("meta", "");
      /* Split: колонки въезжают слева направо. */
      var split = L.el("div", "split", root);
      var head = L.el("div", "head t-mono", split);
      L.el("span", "", head, title); L.el("span", "muted", head, meta);
      var usable = L.W - S.left - S.right, gap = 12, cw = (usable - gap * (stages.length - 1)) / stages.length;
      var cols = stages.map(function (p, i) {
        var c = L.el("div", "col", split);
        c.style.left = S.left + i * (cw + gap) + "px"; c.style.width = cw + "px";
        var ph = L.photo(c, p); ph.style.width = (usable / cw * 100) + "%"; ph.style.left = (-i * (cw + gap) / cw * 100) + "%";
        var l = L.el("div", "lbl t-mono", c); L.el("span", i === 0 ? "" : "muted", l, L.pad(i + 1) + " " + names[i]);
        return c;
      });
      var foot = L.el("div", "foot t-mono", split);
      L.el("span", "bar", foot); L.el("span", "", foot, names.join(" → ")); L.el("span", "muted", foot, L.pad(stages.length));
      tl.set(head.children, { autoAlpha: 0 }, 0); tl.set(head.children, { autoAlpha: 1, stagger: B / 4 }, B * .3);
      cols.forEach(function (c, i) { L.slide(tl, c, B * .3 + i * B * .5, { xPercent: 110, dur: B * .8 }); });
      L.bar(tl, foot.firstChild, B * 1.8);
      tl.set(foot.querySelectorAll("span:not(.bar)"), { autoAlpha: 0 }, 0); tl.set(foot.querySelectorAll("span:not(.bar)"), { autoAlpha: 1, stagger: B / 4 }, B * 2);
      var t = B * 4.4;
      /* Каждый этап — во весь кадр с гигантским названием. */
      stages.forEach(function (p, i) {
        var g = L.el("div", "shot", root);
        var ph = L.photo(g, p);
        L.el("div", "scrim", g); L.el("div", "scrim top", g);
        var tags = L.el("div", "tags on-photo t-mono", g);
        L.el("span", "", tags, L.pad(i + 1) + " / " + L.pad(stages.length)); L.el("span", "muted", tags, title);
        var cap = L.el("div", "cap on-photo", g);
        var bar = L.el("span", "bar thin", cap); bar.style.position = "relative"; bar.style.display = "block"; bar.style.width = "140px"; bar.style.marginBottom = "30px";
        var lines = L.lines(cap, names[i], 9, "t-display");
        L.cut(tl, g, t, { scale: 1.1 });
        L.bar(tl, bar, t + B * .15); L.slam(tl, lines, t + B * .2);
        L.push(tl, ph, t + B * .9, B * 1.6, .012);
        var end = t + B * 2.5;
        L.slamOut(tl, lines, end - B * .3);
        tl.set(g, { autoAlpha: 0 }, end);
        t = end;
      });
      /* Финал: общий кадр (или последний этап) и инверсный блок с названием. */
      var g = L.el("div", "shot", root);
      var gp = L.photo(g, wide || stages[stages.length - 1]);
      var end = L.el("div", "end block", g);
      var eb = L.el("span", "bar", end);
      var et = L.lines(end, title, 16, "t-head");
      var em = L.el("span", "t-mono muted", end, meta);
      L.cut(tl, g, t, { scale: 1.08 });
      L.push(tl, gp, t, B * 1.6 + 2.4, .008);
      L.slide(tl, end, t + B * .8, { xPercent: 0, yPercent: 100, dur: B * .8 });
      L.bar(tl, eb, t + B * 1.3); L.slam(tl, et, t + B * 1.4);
      tl.fromTo(em, { autoAlpha: 0 }, { autoAlpha: 1, duration: .01 }, t + B * 1.9);
      t += B * 1.6 + 2.4;
      L.finish(tl, root, t);
      L.register("process", tl);
    })();
  </script>
</body>
</html>
